[package]
name = "egui-demo"
version = "0.0.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
retour = { version = "=0.4.0-alpha.4", features = ["static-detour"]}
windows = { version = "0.59.0", features = [
	"Win32_UI_WindowsAndMessaging",
	"Win32_Graphics_Direct3D9",
	"Win32_Graphics_Gdi",
	"Win32_Foundation",
	"Win32_System_LibraryLoader",
	"Win32_System_Threading",
	"Win32_Security"
] }
# shroud = { version = "0.2.3", features = ["directx9"] }
shroud = { git = "https://github.com/ohchase/shroud", branch = "copilot/fix-4fe0fc7d-d5ea-4f92-b5a9-792b1abf5541", features = ["directx9"] }
egui = "0.31"
egui-d3d9 = "0.3.9"
egui_extras = {version = "0.31", features = ["webp"]}